{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Change password</h1>
  {% if current_user.must_change_password %}
    <p class="flash error">Welcome! For security, choose your own password before continuing. You can add Face sign-in afterwards.</p>
  {% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password (min 8 characters) <input type="password" name="password" autocomplete="new-password" required></label>
    <label>Confirm new password <input type="password" name="confirm" autocomplete="new-password" required></label>
    <button>Save password</button>
  </form>
</div>
{% endblock %}
