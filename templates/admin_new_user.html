{% extends "base.html" %}
{% block title %}Add user{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Add user</h1>
  <p class="muted">You create the account, then capture the face on the next page. The user must change the temporary password at first login.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Full name <input type="text" name="full_name" required></label>
    <label>Username <input type="text" name="username" required></label>
    <label>Temporary password (min 8 characters) <input type="password" name="password" autocomplete="new-password" required></label>
    <button>Create and capture face</button>
  </form>
</div>
{% endblock %}
